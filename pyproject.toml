[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-translator"
version = "0.1.0"
description = "Offline PDF extraction and validated local translation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.28,<2", "openai>=1.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
